# Tests and a debug APK for the Android client (android/) on every push and
# pull request that touches it. Screenshots: android-screenshots.yml (by hand).
name: android

on:
  push:
    paths: ["android/**", ".github/workflows/android.yml"]
  pull_request:
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v5
      - name: Test the core client and terminal engine, build the APK
        run: ./gradlew --no-daemon :protocol:test :terminal:test :app:assembleDebug
      - uses: actions/upload-artifact@v5
        with:
          name: herdr-android-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
      # Release-signed APK: only where the secrets exist (pushes and same-repo
      # pull requests; forks get none). The keystore lives in RUNNER_TEMP, not
      # the workspace, and is deleted at the end. Secrets are only in step env.
      - name: Check for signing secrets
        id: signing
        env:
          HAVE_KEYSTORE: ${{ secrets.HERDR_KEYSTORE_B64 != '' && secrets.HERDR_KEYSTORE_PASSWORD != '' && secrets.HERDR_KEY_ALIAS != '' }}
        run: |
          if [ "$HAVE_KEYSTORE" = "true" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Signing secrets are not available here (fork or not set): skipping the release-signed APK."
          fi
      - name: Decode the release keystore
        if: steps.signing.outputs.available == 'true'
        env:
          KEYSTORE_B64: ${{ secrets.HERDR_KEYSTORE_B64 }}
        run: |
          umask 077
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/herdr-release.p12"
          echo "HERDR_KEYSTORE=$RUNNER_TEMP/herdr-release.p12" >> "$GITHUB_ENV"
      - name: Build the release APK
        if: steps.signing.outputs.available == 'true'
        env:
          HERDR_KEYSTORE_PASSWORD: ${{ secrets.HERDR_KEYSTORE_PASSWORD }}
          HERDR_KEY_ALIAS: ${{ secrets.HERDR_KEY_ALIAS }}
        run: ./gradlew --no-daemon :app:assembleRelease
      - name: Verify the release APK is signed with the release key
        if: steps.signing.outputs.available == 'true'
        env:
          EXPECTED: e77aa4e4df4f58d5b98ee736bbe7a1318c1b1381e742ecedca616a7e0166cbed
        run: |
          apk=$(ls app/build/outputs/apk/release/*.apk | head -n 1)
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -n 1)
          "$apksigner" verify --print-certs "$apk" > "$RUNNER_TEMP/certs.txt"
          got=$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' "$RUNNER_TEMP/certs.txt")
          if [ "$got" != "$EXPECTED" ]; then
            echo "::error::Release APK certificate is $got, expected $EXPECTED"
            exit 1
          fi
          echo "Release APK certificate SHA-256 matches $EXPECTED"
      - uses: actions/upload-artifact@v5
        if: steps.signing.outputs.available == 'true'
        with:
          name: herdr-android-release-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
      - name: Delete the release keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/herdr-release.p12"
