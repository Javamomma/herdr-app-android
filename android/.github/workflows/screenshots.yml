# Screenshots of the demo on an emulator sized like a Galaxy Z Fold 7, then
# the safety checks (scripts/safety-check.sh) on the same emulator.
# Run by hand from the Actions tab; the PNGs land in the run's artifacts.
name: screenshots

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  screenshots:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v5
      - name: Build the APK
        run: ./gradlew --no-daemon :app:assembleDebug && mkdir -p apk && cp app/build/outputs/apk/debug/app-debug.apk apk/
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            ./scripts/screenshots.sh apk/app-debug.apk screenshots
            ./scripts/safety-check.sh screenshots
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: herdr-android-screenshots
          path: screenshots/
          if-no-files-found: error
