# Tests and a debug APK on every push and pull request.
# Screenshots live in screenshots.yml (run it by hand).
name: build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v5
      - name: Test the core client and terminal engine, build the APK
        run: ./gradlew --no-daemon :protocol:test :terminal:test :app:assembleDebug
      - uses: actions/upload-artifact@v5
        with:
          name: herdr-android-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
