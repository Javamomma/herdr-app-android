# Push a tag like v0.2.0: tests, a release APK signed with the project's key,
# and a GitHub release with the APK and its notes from CHANGELOG.md.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-disabled: true
      - name: Unpack the signing key
        env:
          KEYSTORE_B64: ${{ secrets.HERDR_KEYSTORE_B64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then echo "::error::Add the HERDR_KEYSTORE_B64 secret first (RELEASING.md)"; exit 1; fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.p12"
          echo "HERDR_KEYSTORE=$RUNNER_TEMP/release.p12" >> "$GITHUB_ENV"
      - name: Test and build the release APK
        env:
          HERDR_KEYSTORE_PASSWORD: ${{ secrets.HERDR_KEYSTORE_PASSWORD }}
          HERDR_KEY_ALIAS: ${{ secrets.HERDR_KEY_ALIAS }}
        run: ./gradlew --no-daemon :protocol:test :terminal:test :app:assembleRelease
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          apk="herdr-android-$version.apk"
          cp app/build/outputs/apk/release/app-release.apk "$apk"
          sha256sum "$apk" > "$apk.sha256"
          awk -v v="$version" '$0 ~ "^## \\[" v "\\]" {on=1; next} /^## \[/ {on=0} on' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "Herdr for Android $version" > notes.md
          gh release create "$GITHUB_REF_NAME" "$apk" "$apk.sha256" --title "Herdr for Android $version" --notes-file notes.md
      - name: Forget the key
        if: always()
        run: rm -f "$RUNNER_TEMP/release.p12"
