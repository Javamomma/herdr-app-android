<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<link rel="stylesheet" href="xterm.css">
<style>
  html, body { margin: 0; padding: 0; height: 100%; width: 100%; overflow: hidden; background: #16171b; }
  #t { position: absolute; inset: 2px 2px 2px 4px; }
  .xterm .xterm-viewport { overflow-y: auto; }
</style>
</head>
<body>
<div id="t"></div>
<script src="xterm.js"></script>
<script src="addon-fit.js"></script>
<script>
// One core terminal, drawn by xterm.js. Herdr (Kotlin) feeds it the attach
// stream and carries what it sends back to the core.
const params = new URLSearchParams(location.search);
const term = new Terminal({
  fontFamily: 'ui-monospace, "Roboto Mono", "Droid Sans Mono", monospace',
  fontSize: Number(params.get('fs') || 13),
  cursorBlink: true,
  scrollback: 5000,
  allowProposedApi: true,
  convertEol: false,
  theme: {
    background: '#16171b', foreground: '#d8dae0', cursor: '#e8a04c', cursorAccent: '#16171b',
    selectionBackground: '#3a3f4b',
    black: '#1e2027', red: '#e06c75', green: '#98c379', yellow: '#e5c07b', blue: '#61afef',
    magenta: '#c678dd', cyan: '#56b6c2', white: '#d8dae0',
    brightBlack: '#5c6370', brightRed: '#ef8189', brightGreen: '#a9d68b', brightYellow: '#f0cf8f',
    brightBlue: '#7cc0f7', brightMagenta: '#d495ea', brightCyan: '#6fcad6', brightWhite: '#ffffff',
  },
});
const fit = new FitAddon.FitAddon();
term.loadAddon(fit);
term.open(document.getElementById('t'));

let ctrl = false, alt = false;

function cell() {
  try {
    const d = term._core._renderService.dimensions.css.cell;
    return [Math.round(d.width * devicePixelRatio), Math.round(d.height * devicePixelRatio)];
  } catch (e) { return [0, 0]; }
}

function refit() {
  try { fit.fit(); } catch (e) {}
}

function withMods(d) {
  if (!ctrl && !alt) return d;
  let out = d;
  if (ctrl && d.length === 1) {
    const c = d.toUpperCase().charCodeAt(0);
    if (c >= 64 && c <= 95) out = String.fromCharCode(c - 64);
    else if (d === ' ') out = '\x00';
    else if (d === '?') out = '\x7f';
  }
  if (alt) out = '\x1b' + out;
  ctrl = false; alt = false;
  Herdr.modsUsed();
  return out;
}

term.onData(d => Herdr.input(withMods(d)));
term.onBinary(d => Herdr.binary(d));
term.onResize(({ cols, rows }) => { const c = cell(); Herdr.resize(cols, rows, c[0], c[1]); });
term.onTitleChange(t => Herdr.title(t));
term.textarea.addEventListener('focus', () => Herdr.focus(true));
term.textarea.addEventListener('blur', () => Herdr.focus(false));

new ResizeObserver(() => refit()).observe(document.getElementById('t'));

// ---- called from Kotlin ----------------------------------------------------

function feed(b64) {
  const bin = atob(b64);
  const bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  term.write(bytes, () => Herdr.written(bytes.length));
}

function reset() { term.reset(); }

function note(text) { term.write('\r\n\x1b[2m' + text + '\x1b[0m\r\n'); }

function setMods(c, a) { ctrl = c; alt = a; }

function setFont(px) {
  term.options.fontSize = px;
  refit();
  const c = cell();
  Herdr.resize(term.cols, term.rows, c[0], c[1]);
}

function focusTerm() { term.focus(); }
function blurTerm() { term.blur(); }

function paste(text) { term.paste(text); }

function type(text) { Herdr.input(withMods(text)); }

// Keys the soft keyboard lacks, encoded for the program's current modes.
function key(name) {
  const app = term.modes.applicationCursorKeysMode;
  const csi = (f) => (app ? '\x1bO' : '\x1b[') + f;
  const map = {
    esc: '\x1b', tab: '\t', 'shift-tab': '\x1b[Z', enter: '\r', backspace: '\x7f',
    up: csi('A'), down: csi('B'), right: csi('C'), left: csi('D'),
    home: csi('H'), end: csi('F'), pgup: '\x1b[5~', pgdn: '\x1b[6~', del: '\x1b[3~',
  };
  let d = map[name];
  if (d === undefined) return;
  if (alt) { d = '\x1b' + d; alt = false; ctrl = false; Herdr.modsUsed(); }
  else if (ctrl) { ctrl = false; Herdr.modsUsed(); }
  Herdr.input(d);
}

function copySelection() { return term.getSelection(); }

refit();
const c0 = cell();
Herdr.ready(term.cols, term.rows, c0[0], c0[1]);
</script>
</body>
</html>
